name: Vercel deployment checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun --no-env-file test test/vercel-external-consumer.test.ts test/vercel-http.test.ts
      - run: docker build -f deploy/vercel/Dockerfile -t gbrain-sandbox:check .
